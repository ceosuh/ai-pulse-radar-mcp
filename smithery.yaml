startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - apifyToken
    properties:
      apifyToken:
        type: string
        description: "Your Apify API Token (Get it from https://console.apify.com/settings/integrations)"
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: [
        '-y',
        '@apify/actors-mcp-server',
        '--actors',
        'ceosuh/ai-pulse-radar-mcp'
      ],
      env: {
        APIFY_TOKEN: config.apifyToken
      }
    })
